name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]   # обновление каждые 12 часов
  workflow_dispatch:                    # кнопка ручного запуска
  push: {branches: ["main", "master"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # Общие настройки
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Kyiv

          # 3D-календарь контрибуций за год
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Самые используемые языки
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          # Привычки: в какое время и какие дни вы кодите
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: yes
          plugin_habits_days: 30

          # Добавленные и удалённые строки кода
          plugin_lines: yes

          # Ачивки в компактном виде
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: B
