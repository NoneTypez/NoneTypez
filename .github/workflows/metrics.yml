name: Metrics
on:
  schedule: [{cron: "0 */12 * * *"}]
  workflow_dispatch:

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # Общие настройки
          template: classic
          base: header, activity, community, repositories
          config_timezone: Europe/Kyiv

          # 3D-календарь контрибуций за год
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Самые используемые языки
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_sections: most-used

          # Добавленные и удалённые строки кода
          plugin_lines: yes

          # Плагины habits и achievements отключены 2026-11-13: в lowlighter/metrics они
          # падают с "Unexpected error" (habits: author undefined; achievements: ошибка GraphQL).
